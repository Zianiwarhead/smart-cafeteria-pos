<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <filter id="paper-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1" result="light">
      <feDistantLight azimuth="45" elevation="60" />
    </feDiffuseLighting>
    <feBlend mode="multiply" in="SourceGraphic" in2="light" />
  </filter>
  <rect width="100%" height="100%" fill="#fffef7" />
  <!-- subtle faint horizontal micro-ruled thermal printer feed marks -->
  <line x1="0" y1="20" x2="200" y2="20" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="40" x2="200" y2="40" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="60" x2="200" y2="60" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="140" x2="200" y2="140" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
  <line x1="0" y1="180" x2="200" y2="180" stroke="#f0ede0" stroke-width="0.5" stroke-dasharray="2 6"/>
</svg>
